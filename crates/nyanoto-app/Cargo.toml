[package]
name = "nyanoto-app"
description = "Плеер Nyanoto с графическим интерфейсом"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# Тесты — только у библиотеки: иначе `cargo test` собирает интерфейс дважды и сразу
# (по ~3 ГБ), и сервер сборки уходит в подкачку.
[lib]
doctest = false

[[bin]]
name = "nyanoto"
path = "src/main.rs"
test = false

# Замер отрисовки без экрана (только для разработки): собирается только с
# `--features bench`. Это ещё одна сборка всего интерфейса — вместе с тестами
# она не помещалась в память сервера сборки.
[[example]]
name = "render_bench"
required-features = ["bench"]

[features]
bench = []

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
nyanoto-core = { path = "../nyanoto-core" }
nyanoto-library = { path = "../nyanoto-library" }
serde.workspace = true
serde_json.workspace = true
# Программная отрисовка: без OpenGL окно создаётся в разы быстрее, а памяти
# нужно втрое меньше (драйвер видеокарты не загружается).
slint = { version = "1.18", default-features = false, features = ["std", "renderer-software", "compat-1-2"] }
# Сцены текста (src/stage): разметка слов, контуры букв и рисование кадров.
# Всё это уже собирается внутри Slint, свои зависимости почти ничего не добавляют.
parley = { version = "0.11", default-features = false, features = ["system"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

# Компьютер: окно winit, видеокарта как запасной вариант (`select_renderer`), диктор,
# системные диалоги выбора.
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.17"
slint = { version = "1.18", default-features = false, features = ["unstable-winit-030", "renderer-femtovg", "accessibility"] }

# Телефон: окно — NativeActivity, уведомление и экран блокировки — через Java (JNI).
[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["backend-android-activity-06"] }
jni = "0.21"
ndk-context = "0.1"

# Медиаклавиши и виджет плеера системы (src/system_media.rs). zbus и так
# собирается для экранного диктора (accesskit), здесь он почти ничего не добавляет.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Foundation", "Media", "Storage_Streams", "Win32_Foundation", "Win32_System_Power", "Win32_System_Threading", "Win32_System_Time", "Win32_System_WinRT"]

# Местное время (src/clock.rs); libc и так есть в сборке.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
nyanoto-testkit = { path = "../nyanoto-testkit" }

[build-dependencies]
slint-build = "1.18"
